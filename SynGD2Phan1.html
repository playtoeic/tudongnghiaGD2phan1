<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trò Chơi Ghép Từ Đồng Nghĩa - PLAYTOEIC GD2P1</title>
    <!-- Tích hợp Canvas Confetti để bắn pháo hoa -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Sử dụng bộ Font chữ bo tròn dễ thương hỗ trợ Tiếng Việt cực tốt -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=Quicksand:wght@600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', 'Nunito', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle, #ffebf0 0%, #ffcbd7 50%, #ffafc1 100%);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #2f3640;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* --- Hệ thống hiệu ứng rơi (Kẹo ngọt và Hoạt hình) --- */
        .falling-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .leaf {
            position: absolute;
            top: -50px;
            pointer-events: none;
            animation: fall linear infinite;
            font-size: 24px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15));
        }
        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(105vh) rotate(720deg) translateX(120px); opacity: 0; }
        }

        /* --- Nội dung chính phong cách Hoạt hình Béo tròn --- */
        .main-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        h1 {
            color: #ff477e;
            text-shadow: 3px 3px 0px #ffffff, 6px 6px 0px rgba(255, 71, 126, 0.2); 
            margin-bottom: 10px;
            text-align: center;
            font-size: 36px;
            font-weight: 900;
            letter-spacing: 1px;
        }
        .instructions {
            color: #d93d4a;
            background: #ffffff;
            padding: 12px 26px;
            border-radius: 30px;
            margin-bottom: 25px;
            text-align: center;
            max-width: 700px;
            font-size: 16px;
            font-weight: 700;
            box-shadow: 0 6px 0px #ffb7c5, 0 10px 20px rgba(0,0,0,0.06);
            border: 3px solid #ff477e;
        }

        #reset-btn {
            position: absolute;
            top: 10px;
            right: 20px;
            z-index: 10;
            background-color: #ff6b6b;
            color: white;
            border: 3px solid #ffffff;
            padding: 8px 18px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 0px #c84141, 0 6px 10px rgba(0,0,0,0.1);
            transition: all 0.15s ease-in-out;
        }
        #reset-btn:hover { 
            background-color: #ff5252; 
            transform: translateY(-2px); 
            box-shadow: 0 6px 0px #c84141, 0 8px 12px rgba(0,0,0,0.15);
        }
        #reset-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0px #c84141;
        }
        @media (max-width: 600px) {
            #reset-btn {
                position: static;
                margin-bottom: 15px;
            }
        }

        /* Thanh chia phần (Tabs) như những viên kẹo dẻo */
        .tab-container {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            width: 100%;
            max-width: 1200px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .tab-btn {
            font-family: 'Quicksand', sans-serif;
            padding: 12px 24px;
            border: 3px solid #ff9f43;
            background-color: #fff3e6;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 700;
            font-size: 15px;
            color: #d97d24;
            transition: all 0.15s ease-in-out;
            box-shadow: 0 4px 0px #cc7a29;
        }
        .tab-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0px #cc7a29;
            background-color: #ffffff;
        }
        .tab-btn.active {
            background-color: #ff9f43;
            color: white;
            border-color: #ffffff;
            box-shadow: 0 4px 0px #cc7a29, inset 0 2px 5px rgba(0,0,0,0.1);
        }

        /* Kho chứa từ bong bóng ngọt ngào */
        #vocab-pool {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            width: 100%;
            max-width: 1200px;
            justify-content: center;
            background: rgba(255, 255, 255, 0.85);
            padding: 25px;
            border-radius: 24px;
            box-shadow: 0 10px 0px #ffcad4, 0 15px 30px rgba(228, 130, 152, 0.15);
            margin-bottom: 30px;
            min-height: 80px;
            border: 4px dashed #ff85a1;
            box-sizing: border-box;
        }
        
        /* Chữ Tiếng Anh: Thay đổi màu dịu mắt (Màu Mint ngọc bích pastel), font dễ nhìn */
        .clickable-word {
            font-family: 'Nunito', sans-serif;
            background-color: #4ecdc4; /* Đổi thành màu ngọc dịu, đỡ chói */
            color: #ffffff;
            padding: 10px 22px;
            border-radius: 18px;
            cursor: pointer;
            font-weight: 900;
            font-size: 16px;
            letter-spacing: 0.3px;
            user-select: none;
            border: 3px solid #ffffff;
            box-shadow: 0 4px 0px #3bbbb3, 0 4px 8px rgba(0,0,0,0.08);
            transition: all 0.1s ease-in-out;
        }
        .clickable-word:hover {
            background-color: #3bbbb3;
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 7px 0px #2da39b, 0 6px 12px rgba(0,0,0,0.12);
        }
        .clickable-word:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0px #2da39b;
        }
        .clickable-word.selected {
            background-color: #ff85a1 !important; /* Đổi màu được chọn thành hồng dâu dịu mắt */
            border-color: #ffffff !important;
            transform: scale(1.06) translateY(-2px);
            box-shadow: 0 6px 0px #e05e7c, 0 0px 12px rgba(255, 133, 161, 0.5) !important;
        }

        /* Thẻ từ bay lơ lửng đi theo chuột/ngón tay */
        #floating-cursor-word {
            font-family: 'Nunito', sans-serif;
            position: fixed;
            pointer-events: none;
            background-color: #ff85a1;
            color: white;
            padding: 10px 22px;
            border-radius: 18px;
            font-weight: 900;
            font-size: 16px;
            border: 3px solid #ffffff;
            box-shadow: 0 8px 16px rgba(224, 94, 124, 0.3);
            z-index: 9999;
            display: none;
            transform: translate(15px, 15px);
            white-space: nowrap;
        }

        /* Lưới 3 cột câu hỏi hoạt hình */
        #game-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            width: 100%;
            max-width: 1200px;
            margin-bottom: 30px;
        }
        @media (max-width: 900px) { #game-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { #game-grid { grid-template-columns: 1fr; } }

        .quiz-card {
            padding: 20px;
            border-radius: 22px;
            border: 3px solid #ffffff;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-sizing: border-box;
            box-shadow: 0 8px 0px rgba(0,0,0,0.03), 0 10px 20px rgba(0,0,0,0.02);
            transition: transform 0.2s;
        }
        .quiz-card:hover {
            transform: translateY(-2px);
        }
        
        /* Sửa font Tiếng Việt hiển thị chuẩn mực và sắc nét */
        .vietnamese-def {
            font-family: 'Quicksand', sans-serif;
            font-size: 17px;
            font-weight: 700;
            color: #2c3e50;
            min-height: 42px;
            display: flex;
            align-items: center;
            line-height: 1.4;
        }

        /* Vùng nhận từ béo tròn */
        .drop-zone {
            border: 3px dashed rgba(255, 71, 126, 0.25);
            border-radius: 16px;
            min-height: 75px;
            background-color: rgba(255, 255, 255, 0.5);
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 10px;
            align-content: flex-start;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }
        .drop-zone:hover {
            background-color: #ffffff;
            border-color: #ff477e;
            box-shadow: inset 0 2px 8px rgba(255, 71, 126, 0.05);
        }

        /* Nút điều khiển */
        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 50px;
        }
        #check-btn {
            font-family: 'Quicksand', sans-serif;
            background-color: #2ecc71;
            color: white;
            border: 4px solid #ffffff;
            padding: 14px 45px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 35px;
            cursor: pointer;
            box-shadow: 0 6px 0px #25a25a, 0 8px 20px rgba(46, 204, 113, 0.25);
            transition: all 0.15s ease-in-out;
            letter-spacing: 0.5px;
        }
        #check-btn:hover { 
            background-color: #27ae60; 
            transform: translateY(-3px);
            box-shadow: 0 9px 0px #25a25a, 0 12px 22px rgba(46, 204, 113, 0.35);
        }
        #check-btn:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0px #25a25a;
        }
        
        #result-message {
            font-family: 'Quicksand', sans-serif;
            font-size: 17px;
            font-weight: 700;
            text-align: center;
            min-height: 28px;
            background: #ffffff;
            color: #ff477e;
            padding: 6px 16px;
            border-radius: 15px;
            border: 2px dashed #ff477e;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        /* --- Hệ thống hiển thị con trỏ chuột người chơi khác --- */
        .other-cursor {
            position: fixed;
            pointer-events: none;
            z-index: 99999;
            transition: left 0.08s linear, top 0.08s linear;
        }
        .cursor-pointer {
            width: 0; height: 0;
            border-left: 14px solid #ff4757;
            border-top: 8px solid transparent;
            border-bottom: 8px solid transparent;
            transform: rotate(-35deg);
            filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.15));
        }
        .cursor-pointer-label {
            font-family: 'Quicksand', sans-serif;
            position: absolute;
            left: 14px; top: 14px;
            background: #ff4757;
            color: white;
            font-size: 12px;
            padding: 3px 8px;
            border-radius: 10px;
            white-space: nowrap;
            font-weight: bold;
            border: 2px solid white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        /* Chi tiết bóng từ bóng ma bám đuôi con trỏ */
        .cursor-holding-word {
            font-family: 'Nunito', sans-serif;
            position: absolute;
            left: 15px; top: 38px;
            background-color: rgba(255, 133, 161, 0.95);
            color: white;
            padding: 6px 12px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 14px;
            white-space: nowrap;
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
            border: 2px solid #ffffff;
            animation: pulse-glow 1.5s infinite ease-in-out;
        }
        @keyframes pulse-glow {
            0% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.04); opacity: 1; }
            100% { transform: scale(1); opacity: 0.9; }
        }
    </style>
</head>
<body>

    <div class="falling-container" id="falling-container"></div>

    <div class="main-content">
        <button id="reset-btn">Reset (3)</button>

        <h1>SYNONYMS - PLAYTOEIC (GD2P1)</h1>
        <p class="instructions" id="status-room">🍭 Hãy ghép từ vào ô tiếng Việt và kiểm tra!</p>

        <!-- Thanh chuyển phần -->
        <div class="tab-container">
            <button class="tab-btn active" id="tab-0">Phần 1</button>
            <button class="tab-btn" id="tab-1">Phần 2</button>
            <button class="tab-btn" id="tab-2">Phần 3</button>
        </div>

        <div id="vocab-pool"></div>
        <div id="game-grid"></div>

        <div class="controls">
            <button id="check-btn">Kiểm tra Phần này</button>
            <div id="result-message"></div>
        </div>
    </div>

    <!-- Nhãn bay lơ lửng đi theo chuột/ngón tay của bạn -->
    <div id="floating-cursor-word"></div>

    <!-- Tải Firebase SDK bằng ES Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, onDisconnect, runTransaction } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // Cấu hình Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDLyQqf8nHHKFWqFGht4RtIhI-Xwd1XMLc",
  	    authDomain: "tudongnghiagd2p1-4a0ba.firebaseapp.com",
  	    projectId: "tudongnghiagd2p1-4a0ba",
  	    storageBucket: "tudongnghiagd2p1-4a0ba.firebasestorage.app",
  	    messagingSenderId: "544279529331",
  	    appId: "1:544279529331:web:9ce8490083532764b3a706",
  	    measurementId: "G-GMG9W30EP3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- Dữ liệu tĩnh (Bảng ô màu hoạt hình dẻo ngọt pastel dịu nhẹ) ---
        const pastelColors = [
            'rgba(255, 214, 222, 0.75)', // Hồng dâu kem mềm
            'rgba(255, 238, 204, 0.75)', // Vàng bơ mềm
            'rgba(212, 247, 217, 0.75)', // Xanh lá pastel dịu
            'rgba(214, 241, 252, 0.75)', // Xanh da trời sữa
            'rgba(226, 224, 255, 0.75)', // Tím khoai môn nhạt
            'rgba(255, 224, 252, 0.75)', // Hồng kẹo mút nhạt
            'rgba(228, 252, 244, 0.75)'  // Xanh mint nhạt dịu
        ];
        
        const allPartsData = [
            [
                { "eng": ["Fragile", "easily broken/damaged", "breakable", "delicate"], "vi": "(adj) : mỏng manh, dễ vỡ" },
  		{ "eng": ["Stress", "highlight", "emphasize", "focus on", "concentrate on"], "vi": "(V) : tập trung vào, nhấn mạnh" },
  		{ "eng": ["Routine", "regular", "normal", "usual", "ordinary", "customary"], "vi": "(adj) : thông thường" },
  		{ "eng": ["Stationery", "office supplies"], "vi": "văn phòng phẩm" },
  		{ "eng": ["Outline", "draft", "summary", "sketch"], "vi": "(N) : bản phác thảo, tóm tắt" },
  		{ "eng": ["Responsible for", "accountable for", "in charge of"], "vi": "chịu trách nhiệm" },
  		{ "eng": ["Compensate", "refund", "reimburse", "recompense"], "vi": "(V) : đền bù" },
  		{ "eng": ["Profit", "earnings", "proceeds", "receipts", "returns"], "vi": "(N) : lợi nhuận" },
  		{ "eng": ["Salary", "wage", "pay", "payment", "stipend"], "vi": "(N) : tiền lương" }
            ],
            [
                { "eng": ["Cost", "expense", "overheads", "outlay", "expenditure"], "vi": "(N) : chi phí" },
  		{ "eng": ["Contact", "reach", "get in touch with"], "vi": "(V) : liên lạc" },
  		{ "eng": ["Start", "begin", "commence", "institute", "initiate"], "vi": "(V) : bắt đầu, khởi đầu" },
  		{ "eng": ["Commend", "praise", "compliment", "honor"], "vi": "(V) : khen ngợi" },
  		{ "eng": ["Reliable", "depenable", "trustworthy"], "vi": "(adj) : đáng tin cậy" },
  		{ "eng": ["Rely on/upon", "depend on/upon", "count on"], "vi": "(V) : dựa vào" },
  		{ "eng": ["Competitor", "rival", "opponent", "adversary"], "vi": "(N) : đối thủ cạnh tranh" },
  		{ "eng": ["Reserve", "book", "make a reservation"], "vi": "(V) : đặt trước" },
  		{ "eng": ["Change", "modify", "adjust", "revise", "alter", "correct"], "vi": "(V) : thay đổi, chỉnh sửa" }
            ],
            [
                { "eng": ["Cover", "contain", "include", "consist of", "feature"], "vi": "(V) : bao gồm" },
  		{ "eng": ["Because", "since", "as", "for", "now that", "seeing that", "in that"], "vi": "bởi vì [+clause]" },
  		{ "eng": ["Because of", "due to", "owning to", "thanks to", "on account of", "in view of", "in light of", "as a result of"], "vi": "bởi vì [+N]" },
  		{ "eng": ["Although", "even though", "though", "notwithstanding that", "while"], "vi": "mặc dù" },
  		{ "eng": ["Despite", "in spite of", "notwithstanding", "regardless of"], "vi": "mặc dù" },
  		{ "eng": ["Except (for)", "other than", "apart from", "aside from", "barring", "excluding"], "vi": "ngoại trừ" },
  		{ "eng": ["Impact", "affect", "influence"], "vi": "(V) : ảnh hưởng, tác động" },
  		{ "eng": ["Submit", "turn in", "hand in", "file"], "vi": "(V) : nộp" },
  		{ "eng": ["Exceptional", "excellent", "outstanding", "special"], "vi": "(adj) : xuất sắc" }
            ]
        ];

// --- Biến trạng thái Local ---
        let username = prompt("Nhập tên của bạn để tham gia phòng game:", "Người chơi " + Math.floor(Math.random() * 100)) || "Ẩn danh";
        const myUserId = "user_" + Math.random().toString(36).substr(2, 9);
        const myColor = ["#ef4444", "#3b82f6", "#10b981", "#f59e0b", "#8b5cf6", "#ec4899"][Math.floor(Math.random() * 6)];

        let currentPartIndex = 0;
        let selectedWordLocal = null;
        let resetClickCount = 0; 
        let isCheckedState = false; // BIẾN CỜ: Lưu trạng thái khi bấm nút Kiểm tra

        const vocabPool = document.getElementById('vocab-pool');
        const gameGrid = document.getElementById('game-grid');
        const resultMessage = document.getElementById('result-message');
        const floatingEl = document.getElementById('floating-cursor-word');
        const resetBtn = document.getElementById('reset-btn');

        // Khởi tạo Presence
        const myPresenceRef = ref(db, `presence/${myUserId}`);
        set(myPresenceRef, { name: username, color: myColor, x: 0, y: 0, holdingWord: "" });
        onDisconnect(myPresenceRef).remove();

        // Đồng bộ con trỏ người chơi khác
        onValue(ref(db, 'presence'), (snapshot) => {
            const data = snapshot.val();
            const activeIds = data ? Object.keys(data) : [];
            document.querySelectorAll('.other-cursor').forEach(el => {
                const id = el.id.replace('cursor-', '');
                if (!activeIds.includes(id) || id === myUserId) el.remove();
            });

            if (!data) return;

            Object.keys(data).forEach(id => {
                if (id === myUserId) return;
                const user = data[id];
                
                let cursorEl = document.getElementById(`cursor-${id}`);
                if (!cursorEl) {
                    cursorEl = document.createElement('div');
                    cursorEl.id = `cursor-${id}`;
                    cursorEl.className = 'other-cursor';
                    cursorEl.innerHTML = `
                        <div class="cursor-pointer" style="border-left-color: ${user.color}"></div>
                        <div class="cursor-pointer-label" style="background: ${user.color}">${user.name}</div>
                        <div class="cursor-holding-word" style="display: none;"></div>
                    `;
                    document.body.appendChild(cursorEl);
                }
                
                cursorEl.style.left = user.x + 'px';
                cursorEl.style.top = user.y + 'px';

                const holdingEl = cursorEl.querySelector('.cursor-holding-word');
                if (user.holdingWord && user.holdingWord !== "") {
                    holdingEl.innerText = `📄 ${user.holdingWord}`;
                    holdingEl.style.display = 'block';
                } else {
                    holdingEl.style.display = 'none';
                }
            });
        });

        window.addEventListener('mousemove', (e) => {
            set(ref(db, `presence/${myUserId}/x`), e.clientX);
            set(ref(db, `presence/${myUserId}/y`), e.clientY);
            updateFloatingPosition(e.clientX, e.clientY);
        });

        // Lắng nghe dữ liệu Game
        onValue(ref(db, 'gameState/currentPart'), (snapshot) => {
            const part = snapshot.val();
            if (part !== null && part !== undefined && part !== currentPartIndex) {
                currentPartIndex = part;
                document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
                    btn.classList.toggle('active', idx === part);
                });
                resetLocalSelection();
                resetResetButton(); 
            }
        });

        onValue(ref(db, 'gameState/board'), (snapshot) => {
            const boardState = snapshot.val();
            renderBoardRealtime(boardState);
        });

        function updateFloatingPosition(clientX, clientY) {
            if (selectedWordLocal) {
                floatingEl.style.left = clientX + 'px';
                floatingEl.style.top = clientY + 'px';
            }
        }

        function resetLocalSelection() {
            selectedWordLocal = null;
            isCheckedState = false; // Tắt cờ xem kết quả khi có tương tác mới
            floatingEl.style.display = 'none';
            floatingEl.innerText = '';
            set(ref(db, `presence/${myUserId}/holdingWord`), "");
            document.querySelectorAll('.clickable-word').forEach(el => el.classList.remove('selected'));
        }

        function resetResetButton() {
            resetClickCount = 0;
            resetBtn.innerText = "Reset (3)";
        }

        function generateFreshBoard(partIdx) {
            const partData = allPartsData[partIdx];
            let englishWords = [];
            partData.forEach(item => englishWords = englishWords.concat(item.eng));
            englishWords.sort(() => Math.random() - 0.5);
            let shuffledRows = [...partData].map((item, idx) => ({ vi: item.vi, engOriginal: item.eng, id: idx })).sort(() => Math.random() - 0.5);
            
            return {
                partIndex: partIdx,
                pool: englishWords,
                zones: shuffledRows.map(row => ({ id: row.id, vi: row.vi, answers: row.engOriginal.join(','), currentWords: [] }))
            };
        }

        // Đưa sự kiện trả từ về kho ra ngoài để tránh bị gán lại liên tục
        vocabPool.addEventListener('click', () => {
            if (selectedWordLocal) {
                const wordText = selectedWordLocal.text;
                const source = selectedWordLocal.source;

                if (source.startsWith('zone-')) {
                    const zoneId = parseInt(source.replace('zone-', ''));
                    runTransaction(ref(db, 'gameState/board'), (currentBoard) => {
                        if (currentBoard) {
                            const targetZone = currentBoard.zones.find(z => z.id === zoneId);
                            if (targetZone && targetZone.currentWords && targetZone.currentWords.includes(wordText)) {
                                targetZone.currentWords = targetZone.currentWords.filter(w => w !== wordText);
                                if (!currentBoard.pool) currentBoard.pool = [];
                                currentBoard.pool.push(wordText);
                            }
                        }
                        return currentBoard;
                    }).then((result) => {
                        if(result.committed) resetLocalSelection();
                    });
                }
            }
        });

        // --- Đồng bộ hóa bàn cờ thực ---
        function renderBoardRealtime(boardState) {
            if (!boardState || boardState.partIndex !== currentPartIndex) {
                vocabPool.innerHTML = "<div style='color: #666;'>Đang tạo phòng dữ liệu...</div>";
                const initialBoard = generateFreshBoard(currentPartIndex);
                set(ref(db, 'gameState/board'), initialBoard);
                return;
            }

            vocabPool.innerHTML = "";
            gameGrid.innerHTML = "";

            // 1. Kho chứa từ (Pool)
            if (boardState.pool) {
                boardState.pool.forEach((word) => {
                    const wordEl = document.createElement('div');
                    wordEl.classList.add('clickable-word');
                    wordEl.innerText = word;

                    if (selectedWordLocal && selectedWordLocal.text === word && selectedWordLocal.source === 'pool') {
                        wordEl.classList.add('selected');
                    }

                    wordEl.addEventListener('click', (e) => {
                        e.stopPropagation();
                        if (selectedWordLocal && selectedWordLocal.text === word && selectedWordLocal.source === 'pool') {
                            resetLocalSelection();
                            return;
                        }
                        
                        isCheckedState = false; // Bỏ chế độ xem kết quả nếu đang giữ từ
                        selectedWordLocal = { text: word, source: 'pool' };
                        document.querySelectorAll('.clickable-word').forEach(el => el.classList.remove('selected'));
                        wordEl.classList.add('selected');
                        
                        floatingEl.innerText = word;
                        floatingEl.style.display = 'block';
                        updateFloatingPosition(e.clientX, e.clientY);

                        set(ref(db, `presence/${myUserId}/holdingWord`), word);
                    });
                    vocabPool.appendChild(wordEl);
                });
            }

            // 2. Ô thả từ (Game Grid)
            if (boardState.zones) {
                boardState.zones.forEach((zoneData, index) => {
                    const card = document.createElement('div');
                    card.classList.add('quiz-card');
                    card.style.backgroundColor = pastelColors[index % pastelColors.length];

                    const defEl = document.createElement('div');
                    defEl.classList.add('vietnamese-def');
                    defEl.innerText = `${currentPartIndex * 10 + index + 1}. ${zoneData.vi}`;

                    const dropZone = document.createElement('div');
                    dropZone.classList.add('drop-zone');
                    dropZone.dataset.id = zoneData.id;

                    if (zoneData.currentWords) {
                        const originalData = allPartsData[currentPartIndex][zoneData.id];

                        zoneData.currentWords.forEach(word => {
                            const wordInZoneEl = document.createElement('div');
                            wordInZoneEl.className = 'clickable-word';
                            wordInZoneEl.innerText = word;

                            // LOGIC MỚI: Nếu đang ở trạng thái Kiểm Tra, luôn duy trì màu đúng/sai
                            if (isCheckedState) {
                                if (originalData && originalData.eng.includes(word)) {
                                    wordInZoneEl.style.backgroundColor = "#10b981"; // Đúng -> Màu Xanh
                                } else {
                                    wordInZoneEl.style.backgroundColor = "#ef4444"; // Sai -> Màu Đỏ
                                }
                            }

                            if (selectedWordLocal && selectedWordLocal.text === word && selectedWordLocal.source === `zone-${zoneData.id}`) {
                                wordInZoneEl.classList.add('selected');
                            }

                            wordInZoneEl.addEventListener('click', (e) => {
                                e.stopPropagation();
                                if (selectedWordLocal && selectedWordLocal.text === word && selectedWordLocal.source === `zone-${zoneData.id}`) {
                                    resetLocalSelection();
                                    return;
                                }

                                isCheckedState = false;
                                selectedWordLocal = { text: word, source: `zone-${zoneData.id}` };
                                document.querySelectorAll('.clickable-word').forEach(el => el.classList.remove('selected'));
                                wordInZoneEl.classList.add('selected');
                                
                                floatingEl.innerText = word;
                                floatingEl.style.display = 'block';
                                updateFloatingPosition(e.clientX, e.clientY);

                                set(ref(db, `presence/${myUserId}/holdingWord`), word);
                            });

                            dropZone.appendChild(wordInZoneEl);
                        });
                    }

                    dropZone.addEventListener('click', () => {
                        if (selectedWordLocal) {
                            const wordText = selectedWordLocal.text;
                            const source = selectedWordLocal.source;
                            const targetZoneId = zoneData.id;

                            runTransaction(ref(db, 'gameState/board'), (currentBoard) => {
                                if (!currentBoard) return currentBoard;

                                if (source === 'pool') {
                                    if (currentBoard.pool && currentBoard.pool.includes(wordText)) {
                                        currentBoard.pool = currentBoard.pool.filter(w => w !== wordText);
                                        const targetZone = currentBoard.zones.find(z => z.id === targetZoneId);
                                        if (!targetZone.currentWords) targetZone.currentWords = [];
                                        targetZone.currentWords.push(wordText);
                                    } else {
                                        return;
                                    }
                                } 
                                else if (source.startsWith('zone-')) {
                                    const oldZoneId = parseInt(source.replace('zone-', ''));
                                    if (oldZoneId === targetZoneId) return currentBoard;

                                    const oldZone = currentBoard.zones.find(z => z.id === oldZoneId);
                                    if (oldZone && oldZone.currentWords && oldZone.currentWords.includes(wordText)) {
                                        oldZone.currentWords = oldZone.currentWords.filter(w => w !== wordText);
                                        const targetZone = currentBoard.zones.find(z => z.id === targetZoneId);
                                        if (!targetZone.currentWords) targetZone.currentWords = [];
                                        targetZone.currentWords.push(wordText);
                                    } else {
                                        return;
                                    }
                                }
                                return currentBoard;
                            }).then((result) => {
                                if (result.committed) {
                                    resetLocalSelection();
                                } else {
                                    alert(`Ối! Từ "${wordText}" đã bị một người chơi khác thao tác trước mất rồi.`);
                                    resetLocalSelection();
                                }
                            });
                        }
                    });

                    card.appendChild(defEl);
                    card.appendChild(dropZone);
                    gameGrid.appendChild(card);
                });
            }
        }

        // --- Sự kiện Tab đổi Phần chơi ---
        document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
            btn.addEventListener('click', () => {
                isCheckedState = false;
                set(ref(db, 'gameState/currentPart'), idx);
                const freshBoard = generateFreshBoard(idx);
                set(ref(db, 'gameState/board'), freshBoard);
                resultMessage.innerText = "";
            });
        });

// --- Kiểm tra Kết Quả ---
document.getElementById('check-btn').addEventListener('click', () => {
    isCheckedState = true; // BẬT CỜ KIỂM TRA
    
    // Tự động lấy index của Tab đang active/chọn hiện tại 
    // (Đảm bảo lấy chính xác Part người dùng đang làm)
    const activePartIndex = typeof currentPartIndex !== 'undefined' ? currentPartIndex : 0;
    
    // Chỉ lấy các drop-zone thuộc giao diện tab hiện tại
    const dropZones = document.querySelectorAll('.drop-zone');
    let totalWordsInPart = 0;
    let correctWordsCount = 0;
    let totalUserWords = 0;

    // TÍNH TỔNG SỐ TỪ BẮT BUỘC CỦA TAB HIỆN TẠI
    if (allPartsData && allPartsData[activePartIndex]) {
        allPartsData[activePartIndex].forEach(item => {
            totalWordsInPart += item.eng.length;
        });
    }

    dropZones.forEach(zone => {
        const zoneId = parseInt(zone.dataset.id);
        const originalData = allPartsData[activePartIndex][zoneId];
        
        if (!originalData) return;
        
        const correctAnswers = originalData.eng;
        const childWords = Array.from(zone.children);

        totalUserWords += childWords.length;

        childWords.forEach(wordEl => {
            const wordText = wordEl.innerText.trim();
            if (correctAnswers.includes(wordText)) {
                wordEl.style.backgroundColor = "#10b981"; // Màu xanh - Đúng
                correctWordsCount++;
            } else {
                wordEl.style.backgroundColor = "#ef4444"; // Màu đỏ - Sai
            }
        });
    });

    // KIỂM TRA ĐIỀU KIỆN HOÀN THÀNH TAB HIỆN TẠI
    if (totalWordsInPart > 0 && correctWordsCount === totalWordsInPart && totalUserWords === totalWordsInPart) {
        resultMessage.style.color = '#10b981';
        resultMessage.innerText = `Xuất sắc! Bạn đã hoàn thành Phần ${activePartIndex + 1}! 🎉`;
        
        // KÍCH HOẠT PHÁO HOA CHO TAB NÀY
        triggerFireworks();
    } else {
        resultMessage.style.color = '#e11d48';
        resultMessage.innerText = `Sắp xong rồi, kiểm tra lại các ô màu đỏ ở Phần ${activePartIndex + 1} nhé!`;
    }
});

// --- Hàm Bắn Pháo Hoa ---
function triggerFireworks() {
    const end = Date.now() + 3000;
    (function frame() {
        confetti({ particleCount: 4, angle: 60, spread: 55, origin: { x: 0, y: 0.85 } });
        confetti({ particleCount: 4, angle: 120, spread: 55, origin: { x: 1, y: 0.85 } });
        if (Date.now() < end) requestAnimationFrame(frame);
    }());
}

        // Hộp nút Reset an toàn
        resetBtn.addEventListener('click', () => {
            resetClickCount++;
            if (resetClickCount < 3) {
                resetBtn.innerText = `Reset (${3 - resetClickCount})`;
                resultMessage.style.color = '#f59e0b';
                resultMessage.innerText = `Nhấn thêm ${3 - resetClickCount} lần nữa để reset bàn cờ.`;
            } else {
                isCheckedState = false;
                const freshBoard = generateFreshBoard(currentPartIndex);
                set(ref(db, 'gameState/board'), freshBoard).then(() => {
                    resetResetButton();
                    resetLocalSelection();
                    resultMessage.style.color = '#10b981';
                    resultMessage.innerText = `Đã làm sạch bàn cờ! Các từ đã được nhả về vị trí cũ.`;
                });
            }
        });

    </script>
