<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trò Chơi Ghép Từ Đồng Nghĩa - PLAYTOEIC GD2P1</title>
    <!-- Bộ Font chữ bo tròn hỗ trợ Tiếng Việt -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=Quicksand:wght@600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', 'Nunito', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle, #ffebf0 0%, #ffcbd7 50%, #ffafc1 100%);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #2f3640;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* --- Hệ thống hiệu ứng rơi --- */
        .falling-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .leaf {
            position: absolute;
            top: -50px;
            pointer-events: none;
            animation: fall linear infinite;
            font-size: 24px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15));
        }
        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(105vh) rotate(720deg) translateX(120px); opacity: 0; }
        }

        /* --- Nội dung chính --- */
        .main-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        h1 {
            color: #ff477e; text-shadow: 3px 3px 0px #ffffff, 6px 6px 0px rgba(255, 71, 126, 0.2); 
            margin-bottom: 10px; text-align: center; font-size: 36px; font-weight: 900;
        }
        .instructions {
            color: #d93d4a; background: #ffffff; padding: 12px 26px;
            border-radius: 30px; margin-bottom: 25px; text-align: center;
            max-width: 700px; font-size: 16px; font-weight: 700;
            box-shadow: 0 6px 0px #ffb7c5, 0 10px 20px rgba(0,0,0,0.06); border: 3px solid #ff477e;
        }

        #reset-btn {
            position: absolute; top: 10px; right: 20px; z-index: 10;
            background-color: #f43f5e; color: white; border: none;
            padding: 6px 14px; font-size: 12px; font-weight: bold;
            border-radius: 25px; cursor: pointer;
            box-shadow: 0 4px 0px #c84141, 0 6px 10px rgba(0,0,0,0.1); transition: all 0.2s;
        }
        #reset-btn:hover { background-color: #e11d48; transform: translateY(-1px); }
        @media (max-width: 600px) { #reset-btn { position: static; margin-bottom: 15px; } }

        /* Thanh chuyển Phần (Tabs) */
        .tab-container {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            width: 100%;
            max-width: 1200px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .tab-btn {
            font-family: 'Quicksand', sans-serif;
            padding: 12px 24px;
            border: 3px solid #ff9f43;
            background-color: #fff3e6;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 700;
            font-size: 15px;
            color: #d97d24;
            transition: all 0.15s ease-in-out;
            box-shadow: 0 4px 0px #cc7a29;
        }
        .tab-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0px #cc7a29;
            background-color: #ffffff;
        }
        .tab-btn.active {
            background-color: #ff9f43;
            color: white;
            border-color: #ffffff;
            box-shadow: 0 4px 0px #cc7a29, inset 0 2px 5px rgba(0,0,0,0.1);
        }

        /* Kho chứa từ */
        #vocab-pool {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            width: 100%;
            max-width: 1200px;
            justify-content: center;
            background: rgba(255, 255, 255, 0.85);
            padding: 25px;
            border-radius: 24px;
            box-shadow: 0 10px 0px #ffcad4, 0 15px 30px rgba(228, 130, 152, 0.15);
            margin-bottom: 30px;
            min-height: 80px;
            border: 4px dashed #ff85a1;
            box-sizing: border-box;
        }
        
        .clickable-word {
            font-family: 'Nunito', sans-serif;
            background-color: #4ecdc4;
            color: #ffffff;
            padding: 10px 22px;
            border-radius: 18px;
            cursor: pointer;
            font-weight: 900;
            font-size: 16px;
            letter-spacing: 0.3px;
            user-select: none;
            border: 3px solid #ffffff;
            box-shadow: 0 4px 0px #3bbbb3, 0 4px 8px rgba(0,0,0,0.08);
            transition: all 0.1s ease-in-out;
        }
        .clickable-word:hover {
            background-color: #3bbbb3;
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 7px 0px #2da39b, 0 6px 12px rgba(0,0,0,0.12);
        }
        .clickable-word:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0px #2da39b;
        }
        .clickable-word.selected {
            background-color: #ff85a1 !important;
            border-color: #ffffff !important;
            transform: scale(1.06) translateY(-2px);
            box-shadow: 0 6px 0px #e05e7c, 0 0px 12px rgba(255, 133, 161, 0.5) !important;
        }

        /* Ô từ bay theo con trỏ chuột - Thiết kế phong cách bấm chọn (Nền hồng, viền trắng) */
        #floating-cursor-word {
            position: fixed;
            pointer-events: none;
            font-family: 'Nunito', sans-serif;
            background-color: #ff85a1;
            color: #ffffff;
            padding: 10px 22px;
            border-radius: 18px;
            font-weight: 900;
            font-size: 16px;
            letter-spacing: 0.3px;
            border: 3px solid #ffffff;
            box-shadow: 0 6px 0px #e05e7c, 0 10px 20px rgba(0,0,0,0.2);
            z-index: 9999;
            display: none;
            transform: translate(15px, 15px);
            white-space: nowrap;
        }

        #game-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px;
            width: 100%; max-width: 1200px; margin-bottom: 25px;
        }
        @media (max-width: 900px) { #game-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { #game-grid { grid-template-columns: 1fr; } }

        .quiz-card {
            padding: 15px; border-radius: 14px; backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px); border: 1px solid rgba(255, 255, 255, 0.4);
            display: flex; flex-direction: column; gap: 10px; box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }
        .vietnamese-def { font-size: 20px; font-weight: 700; color: #0f172a; min-height: 38px; display: flex; align-items: center; }

        .drop-zone {
            border: 2px dashed rgba(2, 132, 199, 0.25); border-radius: 10px;
            min-height: 70px; background-color: rgba(255, 255, 255, 0.45);
            display: flex; flex-wrap: wrap; gap: 6px; padding: 8px;
            align-content: flex-start; cursor: pointer; transition: all 0.2s;
        }
        .drop-zone:hover { background-color: rgba(255, 255, 255, 0.75); border-color: #0284c7; }

        .controls { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-bottom: 50px; }
        #reset-btn-check {
            background-color: #10b981; color: white; border: none; padding: 14px 40px;
            font-size: 16px; font-weight: bold; border-radius: 30px; cursor: pointer;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); transition: all 0.2s;
        }
        #reset-btn-check:hover { background-color: #059669; transform: translateY(-1px); }
        #result-message {
            font-size: 16px; font-weight: bold; text-align: center; min-height: 24px;
            background: rgba(255,255,255,0.7); padding: 4px 12px; border-radius: 10px;
        }

        .other-cursor {
            position: fixed; pointer-events: none; z-index: 99999;
            transition: left 0.08s linear, top 0.08s linear;
        }
        .cursor-pointer {
            width: 0; height: 0; border-left: 12px solid #ef4444;
            border-top: 7px solid transparent; border-bottom: 7px solid transparent;
            transform: rotate(-35deg);
        }
        .cursor-pointer-label {
            position: absolute; left: 12px; top: 12px; background: #ef4444;
            color: white; font-size: 11px; padding: 2px 6px; border-radius: 4px;
            white-space: nowrap; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }
        /* Nhãn hiển thị từ người chơi khác giữ - bổ sung viền trắng phong cách bong bóng */
        .cursor-holding-word {
            position: absolute; left: 15px; top: 32px;
            background-color: #ff85a1; color: white;
            padding: 5px 12px; border-radius: 12px; font-weight: 700; font-size: 12px;
            white-space: nowrap; box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            border: 2px solid #ffffff; animation: pulse-glow 1.5s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.03); opacity: 1; }
            100% { transform: scale(1); opacity: 0.9; }
        }

        /* Modal Bảng thống kê */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease-in-out;
        }
        .modal-overlay.show {
            display: flex;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .stats-modal {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: slideUp 0.3s ease-in-out;
        }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .stats-modal h2 {
            color: #ff477e;
            text-align: center;
            font-size: 28px;
            margin: 0 0 20px 0;
            text-shadow: 2px 2px 0px rgba(255, 71, 126, 0.1);
        }
        .stats-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        .stats-table th {
            background: linear-gradient(135deg, #ff477e 0%, #ff85a1 100%);
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: 700;
            border-radius: 8px 8px 0 0;
        }
        .stats-table td {
            padding: 12px;
            border-bottom: 1px solid #f0f0f0;
        }
        .stats-table tr:last-child td {
            border-bottom: none;
        }
        .stats-table tbody tr:nth-child(odd) {
            background-color: #f9f9f9;
        }
        .stats-table tbody tr:hover {
            background-color: #f0f0f0;
        }
        .close-modal-btn {
            display: block;
            margin: 0 auto;
            background-color: #ff477e;
            color: white;
            border: none;
            padding: 12px 40px;
            border-radius: 25px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 71, 126, 0.3);
            transition: all 0.2s;
        }
        .close-modal-btn:hover {
            background-color: #e05e7c;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="falling-container" id="falling-container"></div>

    <div class="main-content">
        <button id="reset-btn">Reset (3)</button>
        <h1>SYNONYMS - PLAYTOEIC (GD2P1)</h1>
        <p class="instructions" id="status-room">🍭 Ghép các từ tiếng Anh vào đúng nghĩa Tiếng Việt!</p>

        <div class="tab-container">
            <button class="tab-btn active" id="tab-0">Phần 1</button>
            <button class="tab-btn" id="tab-1">Phần 2</button>
            <button class="tab-btn" id="tab-2">Phần 3</button>
        </div>

        <div id="vocab-pool"></div>
        <div id="game-grid"></div>

        <div class="controls">
            <div id="result-message"></div>
        </div>
    </div>

    <div id="floating-cursor-word"></div>

    <!-- Modal Bảng thống kê -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="stats-modal">
            <h2>🎉 Hoàn Thành!</h2>
            <table class="stats-table">
                <thead>
                    <tr>
                        <th>👤 Người chơi</th>
                        <th>📊 Số từ đóng góp</th>
                    </tr>
                </thead>
                <tbody id="stats-tbody">
                </tbody>
            </table>
            <button class="close-modal-btn" onclick="document.getElementById('modal-overlay').classList.remove('show')">Đóng</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, onDisconnect, runTransaction } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDLyQqf8nHHKFWqFGht4RtIhI-Xwd1XMLc",
            authDomain: "tudongnghiagd2p1-4a0ba.firebaseapp.com",
            projectId: "tudongnghiagd2p1-4a0ba",
            storageBucket: "tudongnghiagd2p1-4a0ba.firebasestorage.app",
            messagingSenderId: "544279529331",
            appId: "1:544279529331:web:9ce8490083532764b3a706",
            measurementId: "G-GMG9W30EP3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const pastelColors = [
            'rgba(255, 214, 222, 0.75)',
            'rgba(255, 238, 204, 0.75)',
            'rgba(212, 247, 217, 0.75)',
            'rgba(214, 241, 252, 0.75)',
            'rgba(226, 224, 255, 0.75)',
            'rgba(255, 224, 252, 0.75)',
            'rgba(228, 252, 244, 0.75)'
        ];

        const allPartsData = [
            [
                { "eng": ["Fragile", "easily broken/damaged", "breakable", "delicate"], "vi": "(adj) : mỏng manh, dễ vỡ" },
                { "eng": ["Stress", "highlight", "emphasize", "focus on", "concentrate on"], "vi": "(V) : tập trung vào, nhấn mạnh" },
                { "eng": ["Routine", "regular", "normal", "usual", "ordinary", "customary"], "vi": "(adj) : thông thường" },
                { "eng": ["Stationery", "office supplies"], "vi": "văn phòng phẩm" },
                { "eng": ["Outline", "draft", "summary", "sketch"], "vi": "(N) : bản phác thảo, tóm tắt" },
                { "eng": ["Responsible for", "accountable for", "in charge of"], "vi": "chịu trách nhiệm" },
                { "eng": ["Compensate", "refund", "reimburse", "recompense"], "vi": "(V) : đền bù" },
                { "eng": ["Profit", "earnings", "proceeds", "receipts", "returns"], "vi": "(N) : lợi nhuận" },
                { "eng": ["Salary", "wage", "pay", "payment", "stipend"], "vi": "(N) : tiền lương" }
            ],
            [
                { "eng": ["Cost", "expense", "overheads", "outlay", "expenditure"], "vi": "(N) : chi phí" },
                { "eng": ["Contact", "reach", "get in touch with"], "vi": "(V) : liên lạc" },
                { "eng": ["Start", "begin", "commence", "institute", "initiate"], "vi": "(V) : bắt đầu, khởi đầu" },
                { "eng": ["Commend", "praise", "compliment", "honor"], "vi": "(V) : khen ngợi" },
                { "eng": ["Reliable", "depenable", "trustworthy"], "vi": "(adj) : đáng tin cậy" },
                { "eng": ["Rely on/upon", "depend on/upon", "count on"], "vi": "(V) : dựa vào" },
                { "eng": ["Competitor", "rival", "opponent", "adversary"], "vi": "(N) : đối thủ cạnh tranh" },
                { "eng": ["Reserve", "book", "make a reservation"], "vi": "(V) : đặt trước" },
                { "eng": ["Change", "modify", "adjust", "revise", "alter", "correct"], "vi": "(V) : thay đổi, chỉnh sửa" }
            ],
            [
                { "eng": ["Cover", "contain", "include", "consist of", "feature", "is composed"], "vi": "(V) : bao gồm" },
                { "eng": ["Because", "since", "as", "now that", "considering that", "given that"], "vi": "bởi vì [+SVc]" },
                { "eng": ["Because of", "due to", "owning to", "thanks to", "on account of", "in view of", "in light of", "as a result of"], "vi": "bởi vì [+N]" },
                { "eng": ["Although", "even though", "though", "notwithstanding that", "despite the fact that"], "vi": "mặc dù [+SVc]" },
                { "eng": ["Despite", "in spite of", "notwithstanding", "regardless of"], "vi": "mặc dù [+N]" },
                { "eng": ["Except (for)", "but not", "apart from", "aside from", "barring", "excluding", "other than"], "vi": "ngoại trừ [+N]" },
                { "eng": ["Impact", "affect", "influence"], "vi": "(V) : ảnh hưởng, tác động" },
                { "eng": ["Submit", "turn in", "hand in", "file"], "vi": "(V) : nộp" },
                { "eng": ["Exceptional", "excellent", "outstanding", "special"], "vi": "(adj) : xuất sắc" }
            ]
        ];

        let username = prompt("Nhập tên của bạn để tham gia phòng game:", "Người chơi " + Math.floor(Math.random() * 100)) || "Ẩn danh";
        const myUserId = "user_" + Math.random().toString(36).substr(2, 9);
        const myColor = ["#ef4444", "#3b82f6", "#10b981", "#f59e0b", "#8b5cf6", "#ec4899"][Math.floor(Math.random() * 6)];

        let currentPartIndex = 0;
        let selectedWordLocal = null;
        let resetClickCount = 0; 
        let latestBoardStates = {}; // Lưu trữ trạng thái của từng phần

        const vocabPool = document.getElementById('vocab-pool');
        const gameGrid = document.getElementById('game-grid');
        const resultMessage = document.getElementById('result-message');
        const floatingEl = document.getElementById('floating-cursor-word');
        const resetBtn = document.getElementById('reset-btn');
        const modalOverlay = document.getElementById('modal-overlay');
        const statsTbody = document.getElementById('stats-tbody');

        // Tạo tham chiếu vị trí người chơi
        const myPresenceRef = ref(db, `presence/${myUserId}`);

        // Lắng nghe trạng thái kết nối thực tế để xóa dữ liệu ngay khi ngắt/reload
        const connectedRef = ref(db, ".info/connected");
        onValue(connectedRef, (snap) => {
            if (snap.val() === true) {
                // Đăng ký lệnh xóa tự động trên server ngay khi ngắt kết nối
                onDisconnect(myPresenceRef).remove();
                
                // Cập nhật thông tin ban đầu
                set(myPresenceRef, { 
                    name: username, 
                    color: myColor, 
                    x: -100, 
                    y: -100, 
                    holdingWord: "",
                    lastActive: Date.now()
                });
            }
        });

        // Xóa thủ công khi trình duyệt chuẩn bị Reload / Thoát trang
        window.addEventListener('beforeunload', () => {
            set(myPresenceRef, null);
        });

        onValue(ref(db, 'presence'), (snapshot) => {
            const data = snapshot.val() || {};
            const now = Date.now();
            
            if (data) {
                // 1. Dọn dẹp DOM: Xóa các cursor không còn tồn tại trong DB hoặc quá 10s không hoạt động
                document.querySelectorAll('.other-cursor').forEach(el => {
                    const userId = el.id.replace('cursor-', '');
                    if (!data[userId] || (now - (data[userId].lastActive || 0) > 10000)) {
                        el.remove();
                    }
                });

                // 2. Render con trỏ của những người chơi hợp lệ
                Object.keys(data).forEach(id => {
                    if (id === myUserId) return;
                    
                    const user = data[id];
                    if (!user || !user.name || user.name === "undefined" || (now - (user.lastActive || 0) > 10000)) {
                        return;
                    }

                    let cursorEl = document.getElementById(`cursor-${id}`);
                    if (!cursorEl) {
                        cursorEl = document.createElement('div');
                        cursorEl.id = `cursor-${id}`;
                        cursorEl.className = 'other-cursor';
                        cursorEl.innerHTML = `
                            <div class="cursor-pointer" style="border-left-color: ${user.color}"></div>
                            <div class="cursor-pointer-label" style="background: ${user.color}">${user.name}</div>
                            <div class="cursor-holding-word" style="display: none;"></div>
                        `;
                        document.body.appendChild(cursorEl);
                    }
                    
                    cursorEl.style.left = user.x + 'px';
                    cursorEl.style.top = user.y + 'px';

                    const holdingEl = cursorEl.querySelector('.cursor-holding-word');
                    if (user.holdingWord && user.holdingWord !== "") {
                        holdingEl.innerText = `📄 ${user.holdingWord}`;
                        holdingEl.style.display = 'block';
                    } else {
                        holdingEl.style.display = 'none';
                    }
                });
            }
        });

        window.addEventListener('mousemove', (e) => {
            updateFloatingPosition(e.clientX, e.clientY);
            
            // Cập nhật tọa độ và thời gian tương tác mới nhất
            set(ref(db, `presence/${myUserId}/x`), e.clientX);
            set(ref(db, `presence/${myUserId}/y`), e.clientY);
            set(ref(db, `presence/${myUserId}/lastActive`), Date.now());
        });

        // Lắng nghe trạng thái của từng phần riêng biệt
        for (let i = 0; i < 3; i++) {
            onValue(ref(db, `gameState/part${i}`), (snapshot) => {
                const boardState = snapshot.val();
                latestBoardStates[i] = boardState;
                
                // Chỉ render nếu người dùng đang xem phần này
                if (i === currentPartIndex) {
                    renderBoardRealtime(boardState, i);
                }
            });
        }

        function updateFloatingPosition(clientX, clientY) {
            if (selectedWordLocal) {
                floatingEl.style.left = clientX + 'px';
                floatingEl.style.top = clientY + 'px';
            }
        }

        function resetLocalSelection() {
            selectedWordLocal = null;
            floatingEl.style.display = 'none';
            floatingEl.innerText = '';
            set(ref(db, `presence/${myUserId}/holdingWord`), "");
            document.querySelectorAll('.clickable-word').forEach(el => el.classList.remove('selected'));
        }

        function resetResetButton() {
            resetClickCount = 0;
            resetBtn.innerText = "Reset (3)";
        }

        function generateFreshBoard(partIdx) {
            const partData = allPartsData[partIdx];
            let englishWords = [];
            partData.forEach(item => englishWords = englishWords.concat(item.eng));
            englishWords.sort(() => Math.random() - 0.5);
            let shuffledRows = [...partData].map((item, idx) => ({ vi: item.vi, engOriginal: item.eng, id: idx })).sort(() => Math.random() - 0.5);
            
            return {
                partIndex: partIdx,
                pool: englishWords,
                zones: shuffledRows.map(row => ({ id: row.id, vi: row.vi, answers: row.engOriginal.join(','), currentWords: [] }))
            };
        }

        vocabPool.addEventListener('click', () => {
            if (selectedWordLocal) {
                const wordText = selectedWordLocal.text;
                const source = selectedWordLocal.source;

                if (source.startsWith('zone-')) {
                    const zoneId = parseInt(source.replace('zone-', ''));
                    runTransaction(ref(db, `gameState/part${currentPartIndex}`), (currentBoard) => {
                        if (currentBoard) {
                            const targetZone = currentBoard.zones.find(z => z.id === zoneId);
                            if (targetZone && targetZone.currentWords) {
                                targetZone.currentWords = targetZone.currentWords.filter(item => {
                                    const text = typeof item === 'object' ? item.word : item;
                                    return text !== wordText;
                                });
                                if (!currentBoard.pool) currentBoard.pool = [];
                                currentBoard.pool.push(wordText);
                            }
                        }
                        return currentBoard;
                    }).then((result) => {
                        if(result.committed) resetLocalSelection();
                    });
                }
            }
        });

        function calculateContributionStats(boardState) {
            const stats = {};
            if (boardState && boardState.zones) {
                boardState.zones.forEach(zone => {
                    if (zone.currentWords) {
                        zone.currentWords.forEach(wordObj => {
                            const user = typeof wordObj === 'object' ? wordObj.user : 'Ẩn danh';
                            stats[user] = (stats[user] || 0) + 1;
                        });
                    }
                });
            }
            return stats;
        }

        function showCompletionStats(boardState) {
            const stats = calculateContributionStats(boardState);
            statsTbody.innerHTML = '';
            
            const sortedUsers = Object.entries(stats)
                .sort((a, b) => b[1] - a[1]);
            
            sortedUsers.forEach(([user, count]) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${user}</td>
                    <td style="text-align: center; font-weight: 700; color: #ff477e;">${count}</td>
                `;
                statsTbody.appendChild(row);
            });
            
            modalOverlay.classList.add('show');
        }

        function renderBoardRealtime(boardState, partIdx) {
            if (!boardState || boardState.partIndex !== partIdx) {
                vocabPool.innerHTML = "<div style='color: #666;'>Đang tải dữ liệu...</div>";
                const initialBoard = generateFreshBoard(partIdx);
                set(ref(db, `gameState/part${partIdx}`), initialBoard);
                return;
            }

            vocabPool.innerHTML = "";
            gameGrid.innerHTML = "";

            if (boardState.pool) {
                boardState.pool.forEach((word) => {
                    const wordEl = document.createElement('div');
                    wordEl.classList.add('clickable-word');
                    wordEl.innerText = word;

                    if (selectedWordLocal && selectedWordLocal.text === word && selectedWordLocal.source === 'pool') {
                        wordEl.classList.add('selected');
                    }

                    wordEl.addEventListener('click', (e) => {
                        e.stopPropagation();
                        if (selectedWordLocal && selectedWordLocal.text === word && selectedWordLocal.source === 'pool') {
                            resetLocalSelection();
                            return;
                        }
                        selectedWordLocal = { text: word, source: 'pool' };
                        document.querySelectorAll('.clickable-word').forEach(el => el.classList.remove('selected'));
                        wordEl.classList.add('selected');
                        
                        floatingEl.innerText = word;
                        floatingEl.style.display = 'block';
                        updateFloatingPosition(e.clientX, e.clientY);
                        set(ref(db, `presence/${myUserId}/holdingWord`), word);
                    });
                    vocabPool.appendChild(wordEl);
                });
            }

            let totalPartWords = 0;
            let currentCorrectWords = 0;
            let currentTotalPlacedWords = 0;
            let hasAnyRed = false; // NEW: track if any incorrect (red) word exists

            allPartsData[partIdx].forEach(item => totalPartWords += item.eng.length);

            if (boardState.zones) {
                boardState.zones.forEach((zoneData, index) => {
                    const card = document.createElement('div');
                    card.classList.add('quiz-card');
                    card.style.backgroundColor = pastelColors[index % pastelColors.length];

                    const defEl = document.createElement('div');
                    defEl.classList.add('vietnamese-def');
                    defEl.innerText = `${index + 1}. ${zoneData.vi}`;

                    const dropZone = document.createElement('div');
                    dropZone.classList.add('drop-zone');
                    dropZone.dataset.id = zoneData.id;

                    const correctAnswers = zoneData.answers ? zoneData.answers.split(',') : [];

                    if (zoneData.currentWords) {
                        zoneData.currentWords.forEach(wordObj => {
                            const wordText = typeof wordObj === 'object' ? wordObj.word : wordObj;
                            const wordUser = typeof wordObj === 'object' ? wordObj.user : 'Ẩn danh';
                            currentTotalPlacedWords++;

                            const wordInZoneEl = document.createElement('div');
                            wordInZoneEl.className = 'clickable-word';
                            wordInZoneEl.innerHTML = `${wordText} <span class="word-author" style="font-size: 11px; opacity: 0.85;">👤 ${wordUser}</span>`;
                            wordInZoneEl.dataset.wordText = wordText;
                            wordInZoneEl.dataset.wordUser = wordUser;

                            if (correctAnswers.includes(wordText)) {
                                wordInZoneEl.style.backgroundColor = "#10b981"; 
                                wordInZoneEl.style.borderColor = "#ffffff";
                                wordInZoneEl.style.boxShadow = "0 4px 0px #059669, 0 4px 8px rgba(0,0,0,0.08)";
                                currentCorrectWords++;
                            } else {
                                wordInZoneEl.style.backgroundColor = "#ef4444"; 
                                wordInZoneEl.style.borderColor = "#ffffff";
                                wordInZoneEl.style.boxShadow = "0 4px 0px #dc2626, 0 4px 8px rgba(0,0,0,0.08)";
                                hasAnyRed = true; // mark that we have at least one red word
                            }

                            if (selectedWordLocal && selectedWordLocal.text === wordText && selectedWordLocal.source === `zone-${zoneData.id}`) {
                                wordInZoneEl.classList.add('selected');
                            }

                            wordInZoneEl.addEventListener('click', (e) => {
                                e.stopPropagation();
                                if (selectedWordLocal && selectedWordLocal.text === wordText && selectedWordLocal.source === `zone-${zoneData.id}`) {
                                    resetLocalSelection();
                                    return;
                                }
                                selectedWordLocal = { text: wordText, source: `zone-${zoneData.id}` };
                                document.querySelectorAll('.clickable-word').forEach(el => el.classList.remove('selected'));
                                wordInZoneEl.classList.add('selected');
                                
                                floatingEl.innerText = wordText;
                                floatingEl.style.display = 'block';
                                updateFloatingPosition(e.clientX, e.clientY);
                                set(ref(db, `presence/${myUserId}/holdingWord`), wordText);
                            });

                            dropZone.appendChild(wordInZoneEl);
                        });
                    }

                    dropZone.addEventListener('click', () => {
                        if (selectedWordLocal) {
                            const wordText = selectedWordLocal.text;
                            const source = selectedWordLocal.source;
                            const targetZoneId = zoneData.id;

                            runTransaction(ref(db, `gameState/part${partIdx}`), (currentBoard) => {
                                if (!currentBoard) return currentBoard;
                                const newWordObj = { word: wordText, user: username };

                                if (source === 'pool') {
                                    if (currentBoard.pool && currentBoard.pool.includes(wordText)) {
                                        currentBoard.pool = currentBoard.pool.filter(w => w !== wordText);
                                        const targetZone = currentBoard.zones.find(z => z.id === targetZoneId);
                                        if (targetZone) {
                                            if (!targetZone.currentWords) targetZone.currentWords = [];
                                            targetZone.currentWords.push(newWordObj);
                                        }
                                    } else return;
                                } 
                                else if (source.startsWith('zone-')) {
                                    const oldZoneId = parseInt(source.replace('zone-', ''));
                                    if (oldZoneId === targetZoneId) return currentBoard;

                                    const oldZone = currentBoard.zones.find(z => z.id === oldZoneId);
                                    if (oldZone && oldZone.currentWords) {
                                        oldZone.currentWords = oldZone.currentWords.filter(item => {
                                            const text = typeof item === 'object' ? item.word : item;
                                            return text !== wordText;
                                        });
                                        const targetZone = currentBoard.zones.find(z => z.id === targetZoneId);
                                        if (targetZone) {
                                            if (!targetZone.currentWords) targetZone.currentWords = [];
                                            targetZone.currentWords.push(newWordObj);
                                        }
                                    } else return;
                                }
                                return currentBoard;
                            }).then((result) => {
                                if (result.committed) {
                                    resetLocalSelection();
                                } else {
                                    alert(`Ối! Từ "${wordText}" đã bị người khác thao tác trước mất rồi.`);
                                    resetLocalSelection();
                                }
                            });
                        }
                    });

                    card.appendChild(defEl);
                    card.appendChild(dropZone);
                    gameGrid.appendChild(card);
                });
            }

            // NEW FINISH CONDITION:
            // Khi không còn từ màu đỏ (hasAnyRed === false) và không còn từ trong pool -> kết thúc ván
            const poolCount = boardState.pool ? boardState.pool.length : 0;
            if (!hasAnyRed && poolCount === 0) {
                resultMessage.style.color = '#10b981';
                resultMessage.innerText = `🎉 Xuất sắc! Bạn đã hoàn thành Phần ${partIdx + 1}!`;
                // Hiển thị bảng thống kê sau 500ms
                setTimeout(() => {
                    showCompletionStats(boardState);
                }, 500);
            } else {
                resultMessage.style.color = '#e11d48';
                resultMessage.innerText = `Đã xếp ${currentTotalPlacedWords}/${totalPartWords} từ (${currentCorrectWords} từ đúng màu xanh).`;
            }
        }

        document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
            btn.addEventListener('click', () => {
                currentPartIndex = idx;
                document.querySelectorAll('.tab-btn').forEach((b, i) => {
                    b.classList.toggle('active', i === idx);
                });
                resetLocalSelection();
                resetResetButton();
                resultMessage.innerText = "";
                modalOverlay.classList.remove('show');
                
                // Nếu chưa có dữ liệu cho phần này, tạo mới
                if (!latestBoardStates[idx]) {
                    const freshBoard = generateFreshBoard(idx);
                    set(ref(db, `gameState/part${idx}`), freshBoard);
                } else {
                    // Render dữ liệu phần này
                    renderBoardRealtime(latestBoardStates[idx], idx);
                }
            });
        });

        resetBtn.addEventListener('click', () => {
            resetClickCount++;
            if (resetClickCount < 3) {
                resetBtn.innerText = `Reset (${3 - resetClickCount})`;
                resultMessage.style.color = '#f59e0b';
                resultMessage.innerText = `Nhấn thêm ${3 - resetClickCount} lần nữa để reset bàn cờ.`;
            } else {
                const freshBoard = generateFreshBoard(currentPartIndex);
                set(ref(db, `gameState/part${currentPartIndex}`), freshBoard).then(() => {
                    resetResetButton();
                    resetLocalSelection();
                    resultMessage.style.color = '#10b981';
                    resultMessage.innerText = `Đã làm sạch Phần ${currentPartIndex + 1}! Các từ đã được nhả về vị trí cũ.`;
                    modalOverlay.classList.remove('show');
                });
            }
        });

        function createFallingElements() {
            const container = document.getElementById('falling-container');
            const elements = ['🍃', '🌿', '🌸', '🌺', '🌴']; 
            for (let i = 0; i < 25; i++) {
                const item = document.createElement('div');
                item.classList.add('leaf');
                item.innerText = elements[Math.floor(Math.random() * elements.length)];
                item.style.left = Math.random() * 100 + 'vw';
                item.style.fontSize = Math.random() * 15 + 15 + 'px';
                item.style.animationDuration = Math.random() * 8 + 6 + 's';
                item.style.animationDelay = Math.random() * -15 + 's'; 
                container.appendChild(item);
            }
        }
        createFallingElements();

        // Khởi tạo phần đầu tiên
        const initialBoard = generateFreshBoard(0);
        set(ref(db, 'gameState/part0'), initialBoard);
    </script>
</body>
</html>
